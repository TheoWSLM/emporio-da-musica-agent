name: emporio_musica

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

x-backend: &backend
  <<: *hardening
  image: emporio-musica-api:${RELEASE_ID:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://emporio:${POSTGRES_PASSWORD:-emporio}@postgres:5432/emporio
    RELEASE_ID: ${RELEASE_ID:-local}
  cap_drop: [ALL]
  networks: [backend]

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: emporio
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emporio}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1

  migrate:
    <<: *backend
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

  ingest:
    <<: *backend
    restart: "no"
    command: [emporio, ingest]
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    <<: *backend
    depends_on:
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:${API_DEBUG_PORT:-18092}:8000"
    mem_limit: 768m
    cpus: 2
    pids_limit: 256

  # Disposable database for the integration tests (`make test`). Never used by the app.
  postgres-test:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    profiles: [dev]
    environment:
      POSTGRES_DB: emporio_test
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio
    tmpfs: [/var/lib/postgresql/data]
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio_test"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  backend:
